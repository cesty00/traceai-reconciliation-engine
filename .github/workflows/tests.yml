name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Package tested source
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path(".")
          output = Path("traceai-tested-source.zip")
          include = [
              Path("src"),
              Path("config"),
              Path("pyproject.toml"),
              Path("requirements.txt"),
          ]

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for item in include:
                  if item.is_file():
                      archive.write(item, item.as_posix())
                  elif item.is_dir():
                      for path in item.rglob("*"):
                          if path.is_file():
                              archive.write(path, path.as_posix())
          PY

      - name: Upload tested source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: traceai-tested-source
          path: traceai-tested-source.zip
          if-no-files-found: error
          retention-days: 3

  daily_release_gate:
    name: daily-release-gate
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Golden Gate contract
        run: |
          pytest -q \
            tests/test_golden_gate.py \
            tests/test_golden_manifest_contract.py

      - name: Daily orchestrator and delta smoke
        run: |
          pytest -q \
            tests/test_daily.py \
            tests/test_daily_delta.py \
            tests/test_daily_release_gate.py

      - name: Authority boundary assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/traceai_reconciliation/investigation/daily.py").read_text(encoding="utf-8")
          required = [
              '"automatic_approval_allowed": False',
              '"registry_apply_allowed": False',
              '"wms_mutation_allowed": False',
              '"wme_mutation_allowed": False',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Release gate authority boundary missing: " + ", ".join(missing))
          print("Authority boundary present and fail-closed.")
          PY

  release_readiness_gate:
    name: release-readiness-gate
    runs-on: ubuntu-latest
    needs:
      - pytest
      - daily_release_gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Release readiness contract
        run: pytest -q tests/test_release_readiness.py

      - name: Run store migration contract
        run: pytest -q tests/test_run_store.py

      - name: Artifact and output contract checks
        run: |
          pytest -q \
            tests/test_artifact_gate.py \
            tests/test_daily_case_summary.py \
            tests/test_version_contract.py

  release_candidate_gate:
    name: release-candidate-gate
    runs-on: ubuntu-latest
    needs:
      - pytest
      - daily_release_gate
      - release_readiness_gate
    if: ${{ always() }}
    steps:
      - name: Evaluate release-candidate prerequisites
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          DAILY_GATE_RESULT: ${{ needs.daily_release_gate.result }}
          READINESS_GATE_RESULT: ${{ needs.release_readiness_gate.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          checks = {
              "pytest": os.environ["PYTEST_RESULT"],
              "daily-release-gate": os.environ["DAILY_GATE_RESULT"],
              "release-readiness-gate": os.environ["READINESS_GATE_RESULT"],
          }
          failed = {
              name: result
              for name, result in checks.items()
              if result != "success"
          }

          print("Release-candidate prerequisite results:")
          for name, result in checks.items():
              print(f"- {name}: {result}")

          if failed:
              print("RELEASE_CANDIDATE_BLOCKED")
              for name, result in failed.items():
                  print(f"- blocker: {name}={result}")
              sys.exit(1)

          print("RELEASE_CANDIDATE_GATE_GREEN")
          print("- full pytest suite: PASS")
          print("- official 17-case Golden manifest contract: PASS")
          print("- daily orchestrator + delta smoke: PASS")
          print("- fail-closed/source-readiness safety: PASS")
          print("- idempotency/reuse contract: PASS")
          print("- authority boundary/no WMS-WME mutation: PASS")
          print("- release readiness contract: PASS")
          PY
