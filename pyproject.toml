[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "traceai-reconciliation-engine"
version = "0.12.0"
description = "WMS-WME reconciliation and stock difference investigation engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "python-docx>=1.1,<2",
  "lxml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ui = ["streamlit>=1.39,<2"]

[project.scripts]
traceai-reconcile = "traceai_reconciliation.cli:main"
traceai-pilot-acceptance = "traceai_reconciliation.pilot_acceptance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
