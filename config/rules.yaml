version: "0.2"
principles:
  force_match: false
  quantity_rounding_decimals: 3
  keep_raw_immutable: true
  separate_verdict_and_cause: true

verdict_order:
  - MATCH_DIRECT
  - MATCH_NORMALIZARE
  - MATCH_DUPA_NETARE
  - REVIEW
  - NOT_MATCH

evidence_levels:
  A: confirmare_directa
  B: corelare_puternica
  C: probabil
  D: insuficient

active_rules:
  - id: GST-01
    description: "Se neteaza diferentele pe produs intre zone/gestiuni inainte de verdict."
  - id: MAP-04
    description: "NEDEFINIT IN WMS nu se trateaza ca diferenta reala pana la rezolvarea maparii."
  - id: INT-01
    description: "Document WMS lipsa in WME nu este automat NOT_MATCH; se verifica NEOPERAT/respingere."

candidate_rules:
  - id: PROD-02
    description: "Predarile de productie se compara WMS PRODUCTION-OUT cu WME NP dupa document normalizat si cantitate; reversarile WMS se separa de ajustarile negative reziduale."
    status: "CANDIDAT"
  - id: DEL-02
    description: "Livrarile WMS se neteaza cu receptiile/retururile -1/-2/RET_WME inainte de compararea cu AE WME."
    status: "CANDIDAT"
  - id: GST-04
    description: "Fluxurile catre INS.DET pot fi corelate cu DETERIORATE WME numai cand transferul WMS, NT-ul WME si corectia WMS ulterioara se inchid cantitativ exact."
    status: "CANDIDAT"
  - id: OPEN-01
    description: "Diferenta existenta la inceputul perioadei se pastreaza separat si nu se atribuie automat operatiunilor din perioada analizata."
    status: "CANDIDAT"
