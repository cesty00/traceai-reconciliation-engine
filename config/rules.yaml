version: "0.4"
principles:
  force_match: false
  quantity_rounding_decimals: 3
  keep_raw_immutable: true
  separate_verdict_and_cause: true

verdict_order:
  - MATCH_DIRECT
  - MATCH_NORMALIZARE
  - MATCH_DUPA_NETARE
  - REVIEW
  - NOT_MATCH

evidence_levels:
  A: confirmare_directa
  B: corelare_puternica
  C: probabil
  D: insuficient

active_rules:
  - id: GST-01
    description: "Se neteaza diferentele pe produs intre zone/gestiuni inainte de verdict."
  - id: GST-02
    description: "QuantityERP=0 intr-o zona nu dovedeste automat lipsa in WME; se verifica soldul WME si logica raportului."
  - id: GST-03
    description: "Zonele/statusurile WMS se separa de gestiunile contabile WME; un efect de mapare al raportului se confirma numai cu dovada cantitativa."
  - id: MAP-04
    description: "NEDEFINIT IN WMS nu se trateaza ca diferenta reala pana la rezolvarea maparii."
  - id: INT-01
    description: "Document WMS lipsa in WME nu este automat NOT_MATCH; se verifica NEOPERAT/respingere."

candidate_rules:
  - id: PROD-02
    description: "Predarile de productie se compara WMS PRODUCTION-OUT cu WME NP dupa document normalizat si cantitate; reversarile WMS se separa de ajustarile negative reziduale."
    status: "CANDIDAT"
  - id: DEL-02
    description: "Livrarile WMS se neteaza cu receptiile/retururile -1/-2/RET_WME inainte de compararea cu AE WME."
    status: "CANDIDAT"
  - id: GST-04
    description: "Fluxurile catre INS.DET pot fi corelate cu DETERIORATE WME numai cand transferul WMS, NT-ul WME si corectia WMS ulterioara se inchid cantitativ exact."
    status: "CANDIDAT"
  - id: OPEN-01
    description: "Diferenta existenta la inceputul perioadei se pastreaza separat si nu se atribuie automat operatiunilor din perioada analizata."
    status: "CANDIDAT"
  - id: PROD-03
    description: "Ajustarile negative WMS PRODUCTION-IN se compara cu WME BC dupa numarul de comanda normalizat si cantitatea agregata."
    status: "CANDIDAT"

  - id: PROD-04
    description: "Pentru un rezidual PROD-03 de tip BC lipsa confirmat de productie, se verifica global OperationType=BC + document. Zero randuri BC clasifica evenimentul ca WHOLE_BC_DOCUMENT_MISSING; detectorul este evidentiary-only si nu forteaza verdictul produsului."
    status: "CANDIDAT"
  - id: ADJ-01
    description: "Corectiile WMS COR STOC fara document, ramase in afara productiei si fluxurilor speciale deja clasificate, se pastreaza ca WMS_ONLY_REVIEW si pot explica doar probabil o parte din diferenta."
    status: "CANDIDAT"

  - id: WME-01
    description: "Miscarile WME non-standard din afara gestiunilor speciale se raporteaza ca dovezi reziduale, dar nu se adauga automat la diferenta explicata fara o legatura documentara validata."
    status: "CANDIDAT"

  - id: REC-01
    description: "Receptiile WMS cu Numar comanda IN... se compara cu FE pozitive WME dupa Document intrare si cantitatea agregata."
    status: "CANDIDAT"
  - id: REC-02
    description: "Receptiile WMS TRANSFER_CG... se compara cu NT pozitive WME dupa Document intrare; TRANSFER_MOSE ramane in familia dedicata de transfer."
    status: "CANDIDAT"

  - id: C-REC-003
    description: "Pentru WMS IN... Receptie, FE pozitiv WME ramane prioritar; daca FE lipseste pe acelasi Document intrare, se permite fallback la F pozitiv pe acelasi document. Fallback-ul nu inlocuieste un FE existent si nu forteaza MATCH."
    status: "TESTARE_CI"

  - id: TR-MOSE-01
    description: "TRANSFER_MOSE se reconciliaza cu NT WME ca flux intern DP<->MOSE; _DEL_ se neteaza in ordinul de baza, Document intrare are prioritate, iar fallback-ul pe cantitate+directie+data se accepta numai daca este univoc."
    status: "CANDIDAT"
